<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>{% block title %}Jumbros Basketball Challenge{% endblock %}</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏀</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f4f5f7; --surface: #ffffff; --surface-2: #f8f9fb; --border: #e5e7eb;
  --text: #111827; --text-2: #4b5563; --text-3: #9ca3af;
  --accent: #ea580c; --accent-soft: #fff1e8;
  --good: #16a34a; --bad: #dc2626;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 1px 3px rgba(0,0,0,.06);
  --radius: 12px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d0f14; --surface: #161a22; --surface-2: #1c212b; --border: #262c38;
    --text: #f3f4f6; --text-2: #b0b7c3; --text-3: #6b7280;
    --accent: #fb923c; --accent-soft: #2a1a0f;
    --good: #4ade80; --bad: #f87171;
    --shadow: 0 1px 2px rgba(0,0,0,.4);
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: 15px; line-height: 1.5; font-feature-settings: "tnum" 1, "cv11" 1;
}
a { color: inherit; text-decoration: none; }
.wrap { max-width: 1040px; margin: 0 auto; padding: 0 20px 60px; }

/* Top nav */
.topbar { border-bottom: 1px solid var(--border); background: var(--surface); position: sticky; top: 0; z-index: 20; }
.topbar-inner { max-width: 1040px; margin: 0 auto; padding: 0 20px; height: 56px; display: flex; align-items: center; gap: 24px; }
.brand { font-weight: 800; letter-spacing: -.02em; font-size: 17px; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.brand .ball { font-size: 20px; }
.nav { display: flex; gap: 4px; margin-left: auto; overflow-x: auto; scrollbar-width: none; }
.nav a { padding: 6px 12px; border-radius: 8px; font-weight: 500; color: var(--text-2); font-size: 14px; }
.nav a:hover { background: var(--surface-2); color: var(--text); }
.nav a.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
@media (max-width: 560px) {
  .topbar-inner { padding: 0 12px; gap: 8px; }
  .brand span.txt { display: none; }
  .nav { gap: 0; }
  .nav a { padding: 6px 7px; font-size: 13px; white-space: nowrap; }
  .wrap { padding: 0 12px 60px; }
}

/* Page header */
.page-head { padding: 36px 0 20px; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
.page-head h1 { margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -.03em; line-height: 1.15; }
.page-head .sub { color: var(--text-2); margin-top: 4px; font-size: 14px; }
.page-head .meta { color: var(--text-3); font-size: 13px; text-align: right; }
@media (max-width: 560px) { .tag { display: none; } td, th { padding-left: 10px; padding-right: 10px; } .page-head { padding-top: 24px; } .page-head h1 { font-size: 24px; } .page-head .meta { text-align: left; } }

/* Cards & sections */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; margin-bottom: 20px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--border); }
.card-head h2 { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: -.01em; }
.card-head .hint { color: var(--text-3); font-size: 12px; }
.card-body { padding: 18px; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
@media (max-width: 760px) { .grid-2 { grid-template-columns: 1fr; } }

/* Tables */
.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--text-3); padding: 10px 14px; border-bottom: 1px solid var(--border); white-space: nowrap; }
td { padding: 12px 14px; border-bottom: 1px solid var(--border); white-space: nowrap; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: var(--surface-2); }
th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; }
td.rank { color: var(--text-3); font-weight: 600; width: 44px; text-align: center; font-size: 15px; }
td.name { font-weight: 600; }
td.pct { font-weight: 700; }
tr.muted td { color: var(--text-3); }
tr.muted td.name { color: var(--text-2); }
.pos { color: var(--good); } .neg { color: var(--bad); }
.tag { display: inline-block; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; padding: 2px 6px; border-radius: 4px; background: var(--surface-2); color: var(--text-3); margin-left: 8px; vertical-align: middle; }

/* Person color swatch */
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--c, var(--text-3)); margin-right: 9px; vertical-align: -1px; }

/* Buttons */
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(.95); }
.btn.sm { padding: 5px 10px; font-size: 12px; }

/* Sortable tables: <table class="sortable">, <th data-sort>, optional data-v on cells */
table.sortable th[data-sort] { cursor: pointer; user-select: none; }
table.sortable th[data-sort]:hover { color: var(--text); }
table.sortable th.asc::after { content: " ▲"; } table.sortable th.desc::after { content: " ▼"; }

footer { color: var(--text-3); font-size: 12px; text-align: center; padding-top: 20px; }
{% block style %}{% endblock %}
</style>
{% block head %}{% endblock %}
</head>
<body>
<div class="topbar"><div class="topbar-inner">
  <a class="brand" href="{{ root }}/"><span class="ball">🏀</span><span class="txt">Jumbros</span></a>
  <nav class="nav">
    <a href="{{ root }}/" {% if page == 'current' %}class="active"{% endif %}>Standings</a>
    <a href="{{ root }}/draft/" {% if page == 'draft' %}class="active"{% endif %}>Draft</a>
    <a href="{{ root }}/research/" {% if page == 'research' %}class="active"{% endif %}>Research</a>
    <a href="{{ root }}/seasons/" {% if page == 'seasons' %}class="active"{% endif %}>Seasons</a>
    <a href="{{ root }}/all-time/" {% if page == 'alltime' %}class="active"{% endif %}>All-Time</a>
  </nav>
</div></div>
<div class="wrap">
{% block content %}{% endblock %}
<footer>Data from ESPN · Updates twice daily during the season</footer>
</div>
<script>
document.querySelectorAll('table.sortable').forEach(table => {
  table.querySelectorAll('th[data-sort]').forEach((th, _, ths) => th.addEventListener('click', () => {
    const col = [...th.parentNode.children].indexOf(th);
    const desc = !th.classList.contains('desc');
    ths.forEach(h => h.classList.remove('asc', 'desc'));
    th.classList.add(desc ? 'desc' : 'asc');
    const key = tr => { const td = tr.children[col], v = td.dataset.v ?? td.textContent.trim();
                        return v === '' ? null : isNaN(v) ? v.toLowerCase() : +v; };
    const tbody = table.tBodies[0];
    [...tbody.rows].filter(tr => !tr.classList.contains('tier')).sort((a, b) => {
      const x = key(a), y = key(b);
      if (x === null) return 1; if (y === null) return -1;
      return (x < y ? -1 : x > y ? 1 : 0) * (desc ? -1 : 1);
    }).forEach(tr => tbody.appendChild(tr));
  }));
});
</script>
{% block script %}{% endblock %}
</body>
</html>
